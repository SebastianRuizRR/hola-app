<app-encabezado
  titulo="Saludador"
  color="primary"
  subtitulo="Mi primera aplicación Ionic"
  [mostrarAcerca]="saludo !== ''"
></app-encabezado>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      label="Tu nombre"
      labelPlacement="floating"
      placeholder="Escribe tu nombre"
      [(ngModel)]="nombre"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-input
      label="Tu ciudad"
      labelPlacement="floating"
      placeholder="Escribe tu ciudad"
      [(ngModel)]="ciudad"
    ></ion-input>
  </ion-item>

  <ion-button
    expand="block"
    [disabled]="!nombre.trim() || !ciudad.trim()"
    (click)="saludar()"
  >
    Saludar
  </ion-button>

  @if (saludo) {
    <h1 class="ion-text-center">{{ saludo }}</h1>
  }

  <ion-button
    expand="block"
    routerLink="/home/consejo"
  >
    Ver consejo
  </ion-button>

  <router-outlet></router-outlet>
</ion-content>
