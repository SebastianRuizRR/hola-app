<ion-header>
  <ion-toolbar [color]="color">
    @if (volverA) {
      <ion-buttons slot="start">
        <ion-back-button [defaultHref]="volverA"></ion-back-button>
      </ion-buttons>
    }

    <ion-title>
      {{ titulo }}

      @if (subtitulo) {
        <div class="subtitulo">{{ subtitulo }}</div>
      }
    </ion-title>

    @if (mostrarAcerca) {
      <ion-buttons slot="end">
        <ion-button routerLink="/acerca">
          Acerca de
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
